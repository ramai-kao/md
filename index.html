<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<title>Delivery System</title>
<!--
 PASANG: 1) ganti API_URL di bawah dengan URL Web App Apps Script (berakhiran /exec)
         2) upload index.html, sw.js, manifest.json, icon-192.png, icon-512.png ke GitHub Pages / Cloudflare Pages
         3) buka di Chrome Android > menu > "Instal aplikasi"
-->
<style>
:root{--bg:#f5f7fa;--c:#fff;--t:#1d2733;--m:#667788;--p:#1a73e8;--ok:#188038;--w:#e37400;--r:#d93025;--b:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--c:#1a222b;--t:#e8edf2;--m:#9aa7b4;--b:#2b3744}}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:64px}
header{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:10px 12px}
header .r1{display:flex;justify-content:space-between;align-items:center}
header small{opacity:.85;display:block;margin-top:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#f66;margin-right:6px}.dot.on{background:#6f6}
.hb{display:flex;gap:8px;margin-top:8px}
.hb button{flex:1;background:#fff;color:var(--p);border:0;border-radius:8px;padding:10px;font-weight:600;font-size:15px}
main{padding:10px}
button{font:inherit;cursor:pointer}button:disabled{opacity:.4}
.card{background:var(--c);border:1px solid var(--b);border-left:5px solid var(--m);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card.TERANTAR{border-left-color:var(--ok)}.card.PENDING{border-left-color:var(--w)}.card.BATAL_SUPIR{border-left-color:var(--r)}
.card.DIAMBIL{border-left-color:var(--p)}
.top{display:flex;justify-content:space-between;gap:8px}
.chip{font-size:12px;background:var(--bg);border-radius:10px;padding:2px 8px;white-space:nowrap;height:fit-content}
.m{color:var(--m);font-size:13px;margin-top:2px}.amt{font-weight:700;font-size:17px;margin:6px 0}
.err{color:var(--r);font-size:13px;margin:4px 0}
.acts{display:flex;gap:6px}.acts button{flex:1;border:0;border-radius:8px;padding:12px 4px;color:#fff;font-weight:600}
.ok{background:var(--ok)}.wr{background:var(--w)}.rd{background:var(--r)}
.ghost{width:100%;background:none;border:1px solid var(--b);color:var(--t);border-radius:8px;padding:10px}
.sum{display:flex;gap:6px;margin-bottom:10px;text-align:center}
.sum div{flex:1;background:var(--c);border:1px solid var(--b);border-radius:8px;padding:6px 2px;font-size:12px;color:var(--m)}
.sum b{display:block;font-size:18px;color:var(--t)}
.ban{background:#fff3cd;color:#664d03;border-radius:8px;padding:10px;margin-bottom:10px}
.empty{text-align:center;color:var(--m);margin:40px 10px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:14px 0;font-size:14px}nav button.on{color:var(--p);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:8px 14px}
table{width:100%;border-collapse:collapse;background:var(--c);border:1px solid var(--b);border-radius:8px}
th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:right}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;border-top:2px solid var(--m)}
.box{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:10px}
.box button{width:100%;margin-top:8px;padding:12px;border-radius:8px;border:1px solid var(--b);background:none;color:var(--t)}
dialog{border:0;border-radius:12px;width:min(92vw,360px);padding:16px;background:var(--c);color:var(--t)}
dialog label{display:block;margin:8px 0;font-size:13px;color:var(--m)}
dialog input,dialog select{width:100%;padding:12px;font-size:17px;margin-top:4px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t)}
.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--b);background:none;color:var(--t)}.row .pri{background:var(--p);color:#fff;border:0}
#toast{position:fixed;left:12px;right:12px;bottom:76px;background:#222;color:#fff;padding:12px;border-radius:8px;display:none;z-index:20}
#busy{position:fixed;inset:0;background:#0009;color:#fff;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;z-index:30;font-size:17px;text-align:center;padding:20px}
.sp{width:46px;height:46px;border:5px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chk{width:22px;height:22px;margin:2px 10px 0 0}.top{align-items:flex-start}
.sbar{position:fixed;left:0;right:0;bottom:50px;z-index:6;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--c);border-top:1px solid var(--b);padding:8px 12px}
.fl{display:flex;gap:6px;margin-bottom:10px}.fl button{flex:1;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:9px 4px;font-size:13px}.fl button.on{background:var(--p);color:#fff;border-color:var(--p)}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px;color:var(--m);margin:14px 2px 6px}
@media(max-width:420px){nav button{font-size:12px}}
.sbar span{flex:1;font-weight:600}.sbar button{padding:10px 14px;border-radius:8px;border:1px solid var(--b);background:none;color:var(--t);font-weight:600}.sbar .pri{background:var(--p);color:#fff;border:0}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><dialog id="dlg"></dialog><div id="toast"></div><div id="busy" role="alert" aria-live="assertive"><div class="sp"></div><div id="bm">Memproses…</div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbz63OEf3-mBfURnqA70S9byaxEkw-3I84JuB5eW79IOP-2CiU7qbPrv8yQtFpsJSlqt/exec';
const $=s=>document.querySelector(s);
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const LBL={DITUGASKAN:'Belum diantar',PENDING:'Pending',TERANTAR:'Terantar',BATAL_SUPIR:'Batal'};
const ACT=['DITUGASKAN','PENDING'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

// penyimpanan lokal (IndexedDB)
const db=new Promise((res,rej)=>{const r=indexedDB.open('antar',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kv={get:k=>db.then(d=>new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})),
 set:(k,v)=>db.then(d=>new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})),
 del:k=>db.then(d=>new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=r}))};
let S={username:'',user:null,invoice:[],rekap:[],ap:[],ab:[],dl:'',ob:{},up:null,tab:'tugas',bulan:'',pn:0,fq:[],sl:[],fs:'',sh:7};
const save=()=>kv.set('S',S);

// UI helper
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4500)}
let BZ=false;
const busy=(b,m)=>{BZ=!!b;$('#busy').style.display=b?'flex':'none';if(b)$('#bm').textContent=m||'Memproses…'};
function ask(title,fs,msg){return new Promise(r=>{const d=$('#dlg');
 d.innerHTML=`<form method="dialog"><h3 style="margin:0 0 4px">${title}</h3>${msg?`<div class="m">${msg}</div>`:''}${fs.map(f=>f.opts
 ?`<label>${f.l}<select name="${f.n}">${f.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`
 :f.t=='file'?`<label>${f.l}<input name="${f.n}" type="file" accept="image/*" capture="environment"></label>`:`<label>${f.l}<input name="${f.n}" type="${f.t||'text'}" ${f.t=='password'?'inputmode="numeric" maxlength="4" pattern="[0-9]{4}"':''} ${f.o?'':'required'} autocomplete="off"></label>`).join('')}
 <div class="row"><button value="cancel" formnovalidate>Batal</button><button value="ok" class="pri">OK</button></div></form>`;
 d.returnValue='';d.onclose=()=>{const o={};if(d.returnValue==='ok')new FormData(d.querySelector('form')).forEach((v,k)=>o[k]=v);r(d.returnValue==='ok'?o:null)};d.showModal()})}

// API
async function api(p){const c=new AbortController(),t=setTimeout(()=>c.abort(),30000);
 try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),signal:c.signal});
  const j=await r.json();if(!j.ok)throw Object.assign(new Error(j.message),{srv:1});return j.data}
 catch(e){if(e.srv)throw e;throw new Error('Tidak bisa terhubung ke server. Periksa internet lalu coba lagi.')}
 finally{clearTimeout(t)}}

// aksi
const eff=i=>S.ob[i.invoice_no]?S.ob[i.invoice_no].status:i.status;
const nOb=()=>Object.keys(S.ob).length;
async function st(no,status){const i=S.invoice.find(x=>x.invoice_no===no);if(!i)return;let alasan='';
 if(status==='TERANTAR'){const o=await ask('Benar sudah terantar?',[{n:'foto',l:'📷 Foto bukti (boleh dikosongkan)',t:'file'}],esc(i.pelanggan)+'<br>'+esc(no)+' · '+rp(i.nominal));if(!o)return;
  let f=0;if(o.foto&&o.foto.size){busy(1,'Memproses foto…');try{await kv.set('foto:'+no,await kecil(o.foto));f=1}catch(e){toast('Foto gagal diproses, dilanjutkan tanpa foto')}busy(0)}
  S.ob[no]={status,alasan:'',tgl:today(),bv:i.versi,f};await save();render();return}
 if(status!=='TERANTAR'){const o=await ask(status==='PENDING'?'Alasan Pending (antar besok)':'Alasan Batal (kembali ke gudang)',[{n:'a',l:'Pilih alasan',opts:status==='PENDING'?S.ap:S.ab}]);if(!o)return;alasan=o.a}
 S.ob[no]={status,alasan,tgl:today(),bv:i.versi};await save();render()}
const kecil=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.7))};im.onerror=rej;im.src=u});
async function flushFoto(pin){let n=0;for(const no of [...S.fq]){const f=await kv.get('foto:'+no);
  if(f){try{await api({action:'uploadFoto',username:S.username,pin,invoice_no:no,foto:f})}catch(e){if(!e.srv)break}}
  await kv.del('foto:'+no);S.fq=S.fq.filter(x=>x!==no);n++}await save();return n}
async function undo(no){kv.del('foto:'+no);delete S.ob[no];await save();render()}

async function doDownload(pin){const d=await api({action:'download',username:S.username,pin});
 if(d.user.role!=='SUPIR'&&d.user.role!=='GUDANG'){toast('Akun ini tidak dapat dipakai di aplikasi HP.');return}
 S.supir=d.supir_aktif||[];SEL.clear();S.user=d.user;S.invoice=d.invoice;S.rekap=d.rekap;S.ap=d.alasan_pending;S.ab=d.alasan_batal;S.dl=d.server_time;S.pn=d.invoice.length;S.sl=d.selesai||[];S.sh=d.selesai_hari||7;
 Object.keys(S.ob).forEach(no=>{const i=S.invoice.find(x=>x.invoice_no===no);if(!i||i.versi!==S.ob[no].bv)delete S.ob[no]});
 await save();render()}
async function download(){if(BZ)return;if(nOb()&&!confirm('Ada perubahan yang belum diupload. Download akan menjaga perubahan yang masih valid. Lanjutkan?'))return;
 const o=await ask('Download tugas',[{n:'pin',l:'PIN 4 digit',t:'password'}]);if(!o)return;
 busy(1,'Mengunduh data…');try{await doDownload(o.pin);toast('Download berhasil: '+S.invoice.length+' invoice')}catch(e){toast(e.message)}busy(0)}

async function upload(){if(BZ)return;
 const items=Object.keys(S.ob).map(no=>{const o=S.ob[no];return isG()?{invoice_no:no,op:o.op,kode_supir:o.kode,alasan:o.alasan,tgl_antar:o.tgl,pengambil:o.pengambil,base_versi:o.bv}:{invoice_no:no,status:o.status,alasan:o.alasan,tgl_antar:o.tgl,base_versi:o.bv}});
 if(!items.length){if(!S.fq.length)return toast('Tidak ada perubahan untuk diupload');const q=await ask('Kirim '+S.fq.length+' foto tertunda',[{n:'pin',l:'PIN 4 digit',t:'password'}]);if(!q)return;busy(1,'Mengirim foto…');try{const n=await flushFoto(q.pin);toast(n+' foto diproses')}catch(e){toast(e.message)}busy(0);return}
 const o=await ask('Upload '+items.length+' perubahan',[{n:'pin',l:'PIN 4 digit',t:'password'}]);if(!o)return;
 const sig=JSON.stringify(items);
 if(!S.up||S.up.sig!==sig)S.up={sig,id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())};
 await save();busy(1,'Mengirim perubahan…');
 try{const r=await api({action:'upload',username:S.username,pin:o.pin,uploadId:S.up.id,items});const bad=[];
  r.results.forEach(x=>{const o0=S.ob[x.invoice_no];delete S.ob[x.invoice_no];if(o0&&o0.f){if(x.result==='OK'&&(x.status==='TERANTAR'||x.status==='DIAMBIL'))S.fq.push(x.invoice_no);else kv.del('foto:'+x.invoice_no)}const i=S.invoice.find(v=>v.invoice_no===x.invoice_no);if(!i)return;
   if(x.result==='OK'){i.status=x.status;i.versi=x.versi;delete i.note}else{i.note=x.result+': '+x.message;bad.push(x)}});
  S.up=null;await save();render();
  if(S.fq.length){busy(1,'Mengirim foto…');try{await flushFoto(o.pin)}catch(e){}}
  if(bad.length)toast(bad.length+' invoice ditolak/konflik (lihat catatan merah). Silakan Download ulang.');
  else{toast('Upload berhasil');busy(1,'Memperbarui data…');try{await doDownload(o.pin)}catch(e){}}
 }catch(e){toast(e.message)}busy(0)}

async function ping(){if(!S.username||!navigator.onLine)return;
 try{const p=await api({action:'ping',username:S.username});S.pn=p.jumlah;render()}catch(e){}}

async function gantiPin(){const o=await ask('Ganti PIN',[{n:'pin',l:'PIN lama',t:'password'},{n:'np',l:'PIN baru (4 digit)',t:'password'}]);if(!o)return;
 busy(1,'Mengganti PIN…');try{await api({action:'changePin',username:S.username,pin:o.pin,newPin:o.np});toast('PIN berhasil diganti')}catch(e){toast(e.message)}busy(0)}
async function gantiAkun(){if(nOb())return toast('Upload dulu perubahan Anda sebelum ganti akun');
 if(!confirm('Ganti akun? Data lokal akan dihapus.'))return;
 S={...S,username:'',user:null,invoice:[],rekap:[],dl:'',ob:{},up:null,pn:0,sl:[]};await save();render()}
async function setUser(){const v=($('#un').value||'').trim().toLowerCase();if(!v)return;S.username=v;await save();render()}
const months=()=>[...new Set([today().slice(0,7),...S.rekap.map(r=>r.tanggal.slice(0,7))])].sort().reverse();
function mb(k){S.bulan=months()[k];render()}
const tab=t=>{S.tab=t;render()};

// ===== GUDANG =====
const SEL=new Set(),GL={BARU:'Baru',DITERIMA:'Diterima',DIAMBIL:'Diambil toko'};
const isG=()=>S.user&&S.user.role==='GUDANG';
const gi=no=>S.invoice.find(i=>i.invoice_no===no);
const canA=i=>['BARU','DITERIMA'].includes(i.status)&&(!S.ob[i.invoice_no]||S.ob[i.invoice_no].op==='TERIMA');
const opL=o=>({TERIMA:'✓ Diterima',TUGASKAN:'→ '+o.nm,TUGASKAN_ULANG:'→ '+o.nm+' (ulang)',BATAL_TOTAL:'🚫 Batal total',AMBIL_GUDANG:'🏪 Diambil toko'}[o.op]);
function tg(no){SEL.has(no)?SEL.delete(no):SEL.add(no);render()}
function pilihSemua(){const L=S.invoice.filter(canA),all=L.every(i=>SEL.has(i.invoice_no));L.forEach(i=>all?SEL.delete(i.invoice_no):SEL.add(i.invoice_no));render()}
async function pilihSupir(t){if(!S.supir.length){toast('Daftar supir kosong. Download dulu.');return null}
 const o=await ask(t,[{n:'s',l:'Pilih supir (hanya yang Aktif)',opts:S.supir.map(s=>s.kode+' - '+s.nama)}]);if(!o)return null;
 const k=o.s.split(' - ');return{kode:k[0],nm:k.slice(1).join(' - ')}}
async function gTerima(){const L=[...SEL].map(gi).filter(i=>i&&i.status==='BARU'&&!S.ob[i.invoice_no]);
 if(!L.length)return toast('Pilih invoice berstatus Baru');
 L.forEach(i=>S.ob[i.invoice_no]={op:'TERIMA',bv:i.versi});SEL.clear();await save();render()}
async function gTugas(){const L=[...SEL].map(gi).filter(i=>i&&canA(i));if(!L.length)return toast('Pilih invoice dulu');
 const s=await pilihSupir('Tugaskan '+L.length+' invoice');if(!s)return;
 L.forEach(i=>S.ob[i.invoice_no]={op:'TUGASKAN',kode:s.kode,nm:s.nm,bv:i.versi});SEL.clear();await save();render()}
async function gAmbil(){const L=[...SEL].map(gi).filter(i=>i&&canA(i));
 if(!L.length)return toast('Pilih invoice Baru/Diterima dulu');
 const o=await ask('Diambil langsung di gudang ('+L.length+' invoice)',
  [{n:'p',l:'Nama pengambil (opsional)',o:1},{n:'foto',l:'📷 Foto bukti (boleh dikosongkan)',t:'file'}],
  'Invoice langsung selesai tanpa supir.');
 if(!o)return;
 let f=0;
 if(o.foto&&o.foto.size){busy(1,'Memproses foto…');try{const d=await kecil(o.foto);for(const i of L)await kv.set('foto:'+i.invoice_no,d);f=1}catch(e){toast('Foto gagal diproses, dilanjutkan tanpa foto')}busy(0)}
 L.forEach(i=>S.ob[i.invoice_no]={op:'AMBIL_GUDANG',tgl:today(),pengambil:(o.p||'').trim(),bv:i.versi,f});
 SEL.clear();await save();render()}
async function gRetur(no,op){const i=gi(no);if(!i)return;
 if(op==='TUGASKAN_ULANG'){const s=await pilihSupir('Tugaskan ulang ke');if(!s)return;S.ob[no]={op,kode:s.kode,nm:s.nm,bv:i.versi}}
 else{const o=await ask('Batal total',[{n:'a',l:'Alasan',opts:S.ab}]);if(!o)return;S.ob[no]={op,alasan:o.a,bv:i.versi}}
 await save();render()}
function gcard(i){const o=S.ob[i.invoice_no],n=esc(i.invoice_no),ret=i.status==='BATAL_SUPIR';
 return `<div class="card ${ret?'BATAL_SUPIR':i.status}"><div class="top">${!ret&&canA(i)?`<input type="checkbox" class="chk" ${SEL.has(i.invoice_no)?'checked':''} onchange="tg('${n}')">`:''}
 <div style="flex:1"><b>${esc(i.pelanggan)}</b><div class="m">${n} · ${esc(i.tanggal)}${i.salesman?' · '+esc(i.salesman):''}</div></div><span class="chip">${o?opL(o)+' •':(ret?'Retur':GL[i.status])}</span></div>
 <div class="amt">${rp(i.nominal)}</div>${ret?`<div class="m">Dari ${esc(i.retur_dari)} · Alasan: ${esc(i.alasan)}</div>`:''}${i.note?`<div class="err">${esc(i.note)}</div>`:''}
 ${o?`<button class="ghost" onclick="undo('${n}')">↩ Ubah (belum diupload)</button>`:ret?`<div class="acts"><button class="ok" onclick="gRetur('${n}','TUGASKAN_ULANG')">Tugaskan ulang</button><button class="rd" onclick="gRetur('${n}','BATAL_TOTAL')">Batal total</button></div>`:''}</div>`}
const banG=()=>S.pn>S.invoice.length?`<div class="ban">📦 Ada invoice baru/retur di server (${S.pn}). Silakan <b>Download</b>.</div>`:'';
function vInv(){const L=S.invoice.filter(i=>i.status!=='BATAL_SUPIR'&&i.status!=='DIAMBIL');
 if(!L.length)return banG()+'<div class="empty">Tidak ada invoice baru.<br>Tekan <b>Download</b> saat online.</div>';
 return banG()+`<div class="bar"><b>${L.length} invoice</b><button onclick="pilihSemua()">Pilih semua</button></div>`+L.map(gcard).join('')}
function vRetur(){const L=S.invoice.filter(i=>i.status==='BATAL_SUPIR');return banG()+(L.length?L.map(gcard).join(''):'<div class="empty">Tidak ada invoice retur.</div>')}
function vGrekap(){const t=today(),A={};S.supir.forEach(s=>A[s.kode]={n:s.nama,h:0,q:0,v:0});
 S.rekap.forEach(r=>{const a=A[r.kode_supir]=A[r.kode_supir]||{n:r.nama,h:0,q:0,v:0};if(r.tanggal===t)a.h+=r.qty;a.q+=r.qty;a.v+=r.nilai});
 const K=Object.keys(A).sort(),T=K.reduce((a,k)=>({h:a.h+A[k].h,q:a.q+A[k].q,v:a.v+A[k].v}),{h:0,q:0,v:0});
 return `<table><thead><tr><th>Supir</th><th>Hari ini</th><th>Bulan ini</th><th>Nilai (Rp)</th></tr></thead><tbody>${K.map(k=>`<tr><td>${esc(A[k].n)}</td><td>${A[k].h}</td><td>${A[k].q}</td><td>${A[k].v.toLocaleString('id-ID')}</td></tr>`).join('')}</tbody>
 <tfoot><tr><td>TOTAL</td><td>${T.h}</td><td>${T.q}</td><td>${T.v.toLocaleString('id-ID')}</td></tr></tfoot></table><p class="m">Qty = invoice Terantar. Diperbarui saat Download (${esc(S.dl||'belum pernah')}).</p>`}
const BL3=BLN.map(b=>b.slice(0,3));
const tglId=d=>{const p=String(d||'').split('-');return p.length==3?(+p[2])+' '+BL3[p[1]-1]+' '+p[0]:esc(d)};
function fsel(x){S.fs=x;render()}
const scard=i=>{const dm=i.status==='DIAMBIL';
 return `<div class="card ${dm?'DIAMBIL':'TERANTAR'}"><div class="top"><div style="flex:1"><b>${esc(i.pelanggan)}</b><div class="m">${esc(i.invoice_no)} · ${esc(i.tanggal)}${i.salesman?' · '+esc(i.salesman):''}</div></div><span class="chip">${dm?'🏪 Diambil toko':'🚚 Diantar'}</span></div>
 <div class="amt">${rp(i.nominal)}</div><div class="m">${dm?esc(i.alasan||'Diambil di gudang'):'Supir: '+esc(i.supir_nama||i.kode_supir||'-')}</div></div>`};
function vSelesai(){const all=S.sl,L=all.filter(i=>!S.fs||i.status===S.fs),c=s=>all.filter(i=>i.status===s).length;
 const fl=`<div class="fl">${[['','Semua ('+all.length+')'],['TERANTAR','Diantar ('+c('TERANTAR')+')'],['DIAMBIL','Diambil toko ('+c('DIAMBIL')+')']].map(([k,l])=>`<button class="${S.fs===k?'on':''}" onclick="fsel('${k}')">${l}</button>`).join('')}</div>`;
 if(!all.length)return fl+'<div class="empty">Belum ada data selesai.<br>Tekan <b>Download</b> saat online.</div>';
 if(!L.length)return fl+'<div class="empty">Tidak ada data untuk filter ini.</div>';
 const G={};L.forEach(i=>(G[i.tgl_antar]=G[i.tgl_antar]||[]).push(i));
 return fl+Object.keys(G).sort().reverse().map(d=>{const a=G[d],v=a.reduce((x,i)=>x+i.nominal,0);
  return `<div class="gh"><span>${tglId(d)} · ${a.length} invoice</span><span>${rp(v)}</span></div>`+a.map(scard).join('')}).join('')+`<p class="m">Data ${S.sh||7} hari terakhir menurut tanggal antar/ambil. Diperbarui saat Download (${esc(S.dl||'belum pernah')}).</p>`}
const sbar=()=>isG()&&S.tab==='inv'&&SEL.size?`<div style="height:100px"></div><div class="sbar"><span>${SEL.size} dipilih</span><button onclick="gTerima()">Terima</button><button onclick="gAmbil()">🏪 Diambil toko</button><button class="pri" onclick="gTugas()">Tugaskan…</button></div>`:'';
const vBody=()=>isG()?{inv:vInv,retur:vRetur,selesai:vSelesai,grekap:vGrekap,akun:vAkun}[S.tab]():S.tab==='rekap'?vRekap():S.tab==='akun'?vAkun():vTugas();
const TABS=()=>isG()?[['inv','📦 Invoice'],['retur','↩ Retur'+(S.invoice.filter(i=>i.status==='BATAL_SUPIR').length?' ('+S.invoice.filter(i=>i.status==='BATAL_SUPIR').length+')':'')],['selesai','✅ Selesai'],['grekap','📊 Rekap'],['akun','👤 Akun']]:[['tugas','📋 Tugas'],['rekap','📊 Rekap'],['akun','👤 Akun']];

// tampilan
function card(i){const e=eff(i),o=S.ob[i.invoice_no],a=ACT.includes(i.status),n=esc(i.invoice_no),al=o?o.alasan:(e!=='TERANTAR'?i.alasan:'');
 return `<div class="card ${e}"><div class="top"><b>${esc(i.pelanggan)}</b><span class="chip">${LBL[e]||e}${o?(o.f?' 📷':'')+' •':''}</span></div>
 <div class="m">${n} · ${esc(i.tanggal)}${i.salesman?' · '+esc(i.salesman):''}</div><div class="amt">${rp(i.nominal)}</div>
 ${al?`<div class="m">Alasan: ${esc(al)}</div>`:''}${i.note?`<div class="err">${esc(i.note)}</div>`:''}
 ${a?(o?`<button class="ghost" onclick="undo('${n}')">↩ Ubah (belum diupload)</button>`
 :`<div class="acts"><button class="ok" onclick="st('${n}','TERANTAR')">✅ Terantar</button><button class="wr" onclick="st('${n}','PENDING')">⏳ Pending</button><button class="rd" onclick="st('${n}','BATAL_SUPIR')">❌ Batal</button></div>`):''}</div>`}

function vTugas(){const L=S.invoice;if(!L.length)return '<div class="empty">Belum ada tugas.<br>Tekan <b>Download</b> saat online.</div>';
 const c=s=>L.filter(i=>eff(i)===s).length;
 const act=L.filter(i=>ACT.includes(i.status)).length;
 const ban=S.pn>act?`<div class="ban">📦 Ada tugas baru (${S.pn} aktif di server). Silakan <b>Download</b>.</div>`:'';
 const sorted=[...L].sort((a,b)=>(ACT.includes(eff(b))-ACT.includes(eff(a)))||a.pelanggan.localeCompare(b.pelanggan));
 return ban+`<div class="sum"><div><b>${L.length}</b>Total</div><div><b>${c('DITUGASKAN')}</b>Belum</div><div><b>${c('TERANTAR')}</b>Terantar</div><div><b>${c('PENDING')}</b>Pending</div><div><b>${c('BATAL_SUPIR')}</b>Batal</div></div>`+sorted.map(card).join('')}

function vRekap(){const ms=months(),b=ms.includes(S.bulan)?S.bulan:ms[0],k=ms.indexOf(b),[y,m]=b.split('-');
 const R=S.rekap.filter(r=>r.tanggal.startsWith(b)).sort((a,c)=>a.tanggal<c.tanggal?-1:1);
 const q=R.reduce((a,r)=>a+r.qty,0),v=R.reduce((a,r)=>a+r.nilai,0);
 return `<div class="bar"><button ${k>=ms.length-1?'disabled':''} onclick="mb(${k+1})">◀</button><b>${BLN[m-1]} ${y}</b><button ${k<=0?'disabled':''} onclick="mb(${k-1})">▶</button></div>
 <table><thead><tr><th>Tanggal</th><th>Qty</th><th>Nilai (Rp)</th></tr></thead><tbody>
 ${R.length?R.map(r=>`<tr><td>${r.tanggal.slice(8)} ${BLN[m-1].slice(0,3)}</td><td>${r.qty}</td><td>${r.nilai.toLocaleString('id-ID')}</td></tr>`).join(''):'<tr><td colspan="3" style="text-align:center;color:var(--m)">Belum ada data</td></tr>'}
 </tbody><tfoot><tr><td>TOTAL</td><td>${q}</td><td>${v.toLocaleString('id-ID')}</td></tr></tfoot></table>
 <p class="m">Hanya invoice Terantar. Diperbarui saat Download/Upload (${esc(S.dl||'belum pernah')}).</p>`}

function vAkun(){return `<div class="box"><b>${esc(S.user?S.user.nama:'-')}</b><div class="m">Username: ${esc(S.username)}${S.user&&S.user.kode_supir?' · Kode: '+esc(S.user.kode_supir):''}</div>
 <div class="m">Download terakhir: ${esc(S.dl||'belum pernah')}</div><div class="m">Belum diupload: ${nOb()} perubahan</div>
 <button onclick="gantiPin()">🔑 Ganti PIN</button><button onclick="gantiAkun()">Ganti akun</button></div>`}

function render(){const A=$('#app'),N=$('#nav'),y=scrollY;if(!TABS().some(t=>t[0]===S.tab))S.tab=TABS()[0][0];
 if(!S.username){N.innerHTML='';A.innerHTML=`<main><div class="box"><h3 style="margin-top:0">Selamat datang</h3><label>Masukkan username Anda (dari admin)<input id="un" style="width:100%;padding:12px;font-size:17px;margin-top:6px" autocapitalize="none" autocomplete="off"></label><div class="row"><button class="pri" onclick="setUser()">Simpan</button></div></div></main>`;return}
 const on=navigator.onLine,n=nOb();
 A.innerHTML=`<header><div class="r1"><b>${esc(S.user?S.user.nama:S.username)}</b><span><span class="dot ${on?'on':''}"></span>${on?'Online':'Offline'}</span></div>
 <div class="hb"><button onclick="download()">⬇ Download</button><button onclick="upload()">⬆ Upload${n?' ('+n+')':''}</button></div>
 <small>${n?n+' perubahan belum diupload':'Semua perubahan sudah terupload'}</small></header>
 <main>${vBody()}</main>${sbar()}`;
 N.innerHTML=TABS().map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="tab('${k}')">${l}</button>`).join('');scrollTo(0,y)}

addEventListener('online',()=>{render();ping()});addEventListener('offline',render);
(async()=>{const s=await kv.get('S');if(s)S={...S,...s};render();ping();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
</script></body></html>
